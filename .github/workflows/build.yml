name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: targets
        shell: pwsh
        run: |
          $matrix = ./scripts/Get-BuildMatrix.ps1
          ./scripts/Get-DistributionManifest.ps1
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
          "count=$(($matrix | ConvertFrom-Json).include.Count)" >> $env:GITHUB_OUTPUT

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
      - run: bash ./gradlew -Ptarget=1.21.1-fabric :core:test --no-daemon --console=plain

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            25
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
      - run: bash ./gradlew -Ptarget=${{ matrix.node }} :${{ matrix.node }}:clean :${{ matrix.node }}:build --no-daemon --console=plain
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: item-name-copy-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/item-name-copy-*+${{ matrix.loader }}-mc${{ matrix.minecraft }}.jar
          if-no-files-found: error

  collect:
    needs: [matrix, tests, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: item-name-copy-*
          path: dist
          merge-multiple: true
      - shell: pwsh
        env:
          BUILD_MATRIX: ${{ needs.matrix.outputs.matrix }}
        run: |
          $nodes = ($env:BUILD_MATRIX | ConvertFrom-Json).include
          $jars = @(Get-ChildItem dist -Filter '*.jar')
          if ($jars.Count -ne $nodes.Count) { throw 'Target/Jar count mismatch' }
          $entries = @($nodes | ForEach-Object {
            $node = $_
            $files = @($jars | Where-Object { $_.Name -like "item-name-copy-*+$($node.loader)-mc$($node.minecraft).jar" })
            if ($files.Count -ne 1) { throw "Missing or duplicate jar: $($node.node)" }
            [ordered]@{
              target = $node.node
              file = $files[0].Name
              sha256 = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              runtimeVerification = 'pending'
            }
          })
          @{ schemaVersion = 1; artifacts = $entries } | ConvertTo-Json -Depth 4 | Set-Content dist/verification-manifest.json
          ./scripts/Get-DistributionManifest.ps1 -OutputPath dist/distribution-manifest.json
          $distribution = Get-Content dist/distribution-manifest.json -Raw | ConvertFrom-Json
          if (@(Compare-Object @($distribution.artifacts.file) @($jars.Name)).Count -ne 0) {
            throw 'Distribution metadata/Jar mismatch'
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: item-name-copy-all-targets
          path: dist
          if-no-files-found: error
