name: Client tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: targets
        shell: pwsh
        run: '"matrix=$(./scripts/Get-BuildMatrix.ps1)" >> $env:GITHUB_OUTPUT'

  client:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            25
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libasound2t64
      - run: xvfb-run -a pwsh -NoProfile -File ./scripts/Invoke-ClientTests.ps1 -Target '${{ matrix.node }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: client-test-${{ matrix.node }}
          path: |
            build/runtime-verification/
            versions/${{ matrix.node }}/build/reports/client-test/
            versions/${{ matrix.node }}/build/client-test/run/logs/
            versions/${{ matrix.node }}/build/client-test/run/crash-reports/
            /tmp/itemnamecopy-client-tests-*/*.log
