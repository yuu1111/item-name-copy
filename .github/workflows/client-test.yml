name: Client tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libasound2t64
      - run: xvfb-run -a bash ./gradlew -Ptarget=1.21.1-fabric :1.21.1-fabric:runClientTest --no-daemon --console=plain
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: client-test-1.21.1-fabric
          path: |
            versions/1.21.1-fabric/build/reports/client-test/
            versions/1.21.1-fabric/build/client-test/run/logs/
            versions/1.21.1-fabric/build/client-test/run/crash-reports/
