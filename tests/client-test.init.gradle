// IntelliJ does not attach Gradle's script classpath to init scripts loaded only through -I
//noinspection GrUnresolvedAccess,GroovyAssignabilityCheck,GroovyUntypedAccess,UnnecessaryQualifiedReference
gradle.projectsEvaluated {
    gradle.rootProject.allprojects { project ->
        def runDirectory = project.layout.buildDirectory.dir('client-agent/run').get().asFile
        def loom = project.extensions.findByName('loom')
        if (loom != null) loom.runs.configureEach { runDir('build/client-agent/run') }
        for (name in ['neoForge', 'legacyForge']) {
            def extension = project.extensions.findByName(name)
            if (extension != null) extension.runs.configureEach { gameDirectory.set(runDirectory) }
        }
        if (project.plugins.hasPlugin('net.minecraftforge.gradle')) {
            project.extensions.getByName('minecraft').runs.configureEach { workingDir.set(runDirectory) }
        }
        project.tasks.matching { it.name == 'runClient' }.configureEach { task ->
            if (!(task instanceof JavaExec)) {
                throw new GradleException("Unsupported client run task: ${task.path} (${task.class.name})")
            }
            def agent = gradle.rootProject.file('tests/agent/build/libs/client-test-agent.jar')
            def report = project.layout.buildDirectory.file('reports/client-agent/results.json').get().asFile
            def run = runDirectory
            task.workingDir(run)
            task.jvmArgs("-javaagent:${agent.absolutePath}")
            task.systemProperty('itemnamecopy.test.target', project.name)
            task.systemProperty('itemnamecopy.test.report', report.absolutePath)
            task.systemProperty('itemnamecopy.test.source', project.findProperty('clientTestSource') ?: 'unknown')
            task.timeout = java.time.Duration.ofMinutes(5)
            task.doFirst {
                run.mkdirs()
                new File(run, 'options.txt').text = 'lang:en_us\nguiScale:1\nonboardAccessibility:false\n'
                for (file in [report, new File(report.parentFile, 'TEST-client.xml')]) {
                    if (file.exists() && !file.delete()) throw new GradleException("Cannot remove stale report: $file")
                }
            }
            task.doLast {
                if (!report.isFile()) throw new GradleException("Client did not produce a report: $report")
                def result = new groovy.json.JsonSlurper().parse(report)
                if (result.failed != 0 || result.passed == 0 || result.passed != result.expectedTests) {
                    throw new GradleException("Client verification failed: $report")
                }
            }
        }
    }
}
